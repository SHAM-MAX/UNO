<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 645" width="430" height="645">
      
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="3" dy="5" stdDeviation="2" flood-color="#000000" flood-opacity="0.32" />
      </filter>
      <filter id="cornerShadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="2" dy="3" stdDeviation="1" flood-color="#000000" flood-opacity="0.55" />
      </filter>
      <linearGradient id="wildGloss" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
      </linearGradient>
    </defs>
  
      
    <!-- Crisp Outer White Border -->
    <rect x="0" y="0" width="430" height="645" rx="36" fill="#FFFFFF" />
    <!-- Inner Card Colored Face -->
    <rect x="18" y="18" width="394" height="609" rx="26" fill="#1B1C20" />
  
      
    <!-- Tilted Center Oval -->
    <ellipse cx="215" cy="322.5" rx="145" ry="245" transform="rotate(-26 215 322.5)" fill="#1B1C20" />
  
      
    <!-- Center 4 Colored Cards Fan -->
    <g filter="url(#shadow)">
      <!-- Blue Card -->
      <g transform="translate(170, 310) rotate(-22)">
        <rect x="-34" y="-52" width="68" height="104" rx="10" fill="#0055A5" stroke="#FFFFFF" stroke-width="6" />
      </g>
      <!-- Green Card -->
      <g transform="translate(205, 290) rotate(-7)">
        <rect x="-34" y="-52" width="68" height="104" rx="10" fill="#009E3D" stroke="#FFFFFF" stroke-width="6" />
      </g>
      <!-- Red Card -->
      <g transform="translate(235, 295) rotate(10)">
        <rect x="-34" y="-52" width="68" height="104" rx="10" fill="#E52521" stroke="#FFFFFF" stroke-width="6" />
      </g>
      <!-- Yellow Card -->
      <g transform="translate(265, 320) rotate(26)">
        <rect x="-34" y="-52" width="68" height="104" rx="10" fill="#FFD500" stroke="#FFFFFF" stroke-width="6" />
      </g>

      <!-- Big Bold +4 -->
      <text x="215" y="340"
            font-family="'Arial Black', 'Impact', 'Trebuchet MS', 'Arial', sans-serif"
            font-size="160"
            font-weight="900"
            font-style="italic"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#FFFFFF"
            stroke="#18181B"
            stroke-width="12"
            paint-order="stroke fill">+4</text>
    </g>
  
      <g transform="translate(56, 76)">
        
    <g filter="url(#cornerShadow)">
      <text x="0" y="4"
            font-family="'Arial Black', 'Impact', 'Trebuchet MS', 'Arial', sans-serif"
            font-size="56"
            font-weight="900"
            font-style="italic"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#FFFFFF"
            stroke="#18181B"
            stroke-width="5"
            paint-order="stroke fill">+4</text>
    </g>
  
      </g>
      <g transform="rotate(180 215 322.5) translate(56, 76)">
        
    <g filter="url(#cornerShadow)">
      <text x="0" y="4"
            font-family="'Arial Black', 'Impact', 'Trebuchet MS', 'Arial', sans-serif"
            font-size="56"
            font-weight="900"
            font-style="italic"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#FFFFFF"
            stroke="#18181B"
            stroke-width="5"
            paint-order="stroke fill">+4</text>
    </g>
  
      </g>
    </svg>