<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 645" width="430" height="645">
      
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="3" dy="5" stdDeviation="2" flood-color="#000000" flood-opacity="0.32" />
      </filter>
      <filter id="cornerShadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="2" dy="3" stdDeviation="1" flood-color="#000000" flood-opacity="0.55" />
      </filter>
      <linearGradient id="wildGloss" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
      </linearGradient>
    </defs>
  
      
    <!-- Crisp Outer White Border -->
    <rect x="0" y="0" width="430" height="645" rx="36" fill="#FFFFFF" />
    <!-- Inner Card Colored Face -->
    <rect x="18" y="18" width="394" height="609" rx="26" fill="#E52521" />
  
      
    <!-- Tilted Center Oval -->
    <ellipse cx="215" cy="322.5" rx="145" ry="245" transform="rotate(-26 215 322.5)" fill="#FFFFFF" />
  
      
    <!-- Center Skip Icon -->
    <g filter="url(#shadow)">
      <circle cx="215" cy="322.5" r="92" fill="none" stroke="#18181B" stroke-width="40" />
      <line x1="150" y1="387.5" x2="280" y2="257.5" stroke="#18181B" stroke-width="40" stroke-linecap="round" />
      <circle cx="215" cy="322.5" r="92" fill="none" stroke="#E52521" stroke-width="30" />
      <line x1="150" y1="387.5" x2="280" y2="257.5" stroke="#E52521" stroke-width="30" stroke-linecap="round" />
    </g>
  
      <g transform="translate(56, 76)">
        
    <g filter="url(#cornerShadow)" transform="scale(0.85)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#18181B" stroke-width="12" />
      <line x1="-18" y1="18" x2="18" y2="-18" stroke="#18181B" stroke-width="12" stroke-linecap="round" />
      <circle cx="0" cy="0" r="26" fill="none" stroke="#FFFFFF" stroke-width="8" />
      <line x1="-18" y1="18" x2="18" y2="-18" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    </g>
  
      </g>
      <g transform="rotate(180 215 322.5) translate(56, 76)">
        
    <g filter="url(#cornerShadow)" transform="scale(0.85)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#18181B" stroke-width="12" />
      <line x1="-18" y1="18" x2="18" y2="-18" stroke="#18181B" stroke-width="12" stroke-linecap="round" />
      <circle cx="0" cy="0" r="26" fill="none" stroke="#FFFFFF" stroke-width="8" />
      <line x1="-18" y1="18" x2="18" y2="-18" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    </g>
  
      </g>
    </svg>