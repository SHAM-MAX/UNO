<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 645" width="430" height="645">
      
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="3" dy="5" stdDeviation="2" flood-color="#000000" flood-opacity="0.32" />
      </filter>
      <filter id="cornerShadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="2" dy="3" stdDeviation="1" flood-color="#000000" flood-opacity="0.55" />
      </filter>
      <linearGradient id="wildGloss" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
      </linearGradient>
    </defs>
  
      
    <!-- Crisp Outer White Border -->
    <rect x="0" y="0" width="430" height="645" rx="36" fill="#FFFFFF" />
    <!-- Inner Card Colored Face -->
    <rect x="18" y="18" width="394" height="609" rx="26" fill="#009E3D" />
  
      
    <!-- Tilted Center Oval -->
    <ellipse cx="215" cy="322.5" rx="145" ry="245" transform="rotate(-26 215 322.5)" fill="#FFFFFF" />
  
      
    <!-- Center Reverse Arrows -->
    <g filter="url(#shadow)" transform="translate(215, 322.5) scale(1.75)">
      <!-- Top Arrow (flowing left) -->
      <path d="M-40 -18 L24 -18 A22 22 0 0 1 46 4 L46 16" fill="none" stroke="#18181B" stroke-width="22" stroke-linecap="round"/>
      <path d="M-40 -18 L24 -18 A22 22 0 0 1 46 4 L46 16" fill="none" stroke="#009E3D" stroke-width="16" stroke-linecap="round"/>
      <polygon points="-58,-18 -32,-36 -32,0" fill="#009E3D" stroke="#18181B" stroke-width="5" stroke-linejoin="round"/>

      <!-- Bottom Arrow (flowing right) -->
      <path d="M40 18 L-24 18 A22 22 0 0 1 -46 -4 L-46 -16" fill="none" stroke="#18181B" stroke-width="22" stroke-linecap="round"/>
      <path d="M40 18 L-24 18 A22 22 0 0 1 -46 -4 L-46 -16" fill="none" stroke="#009E3D" stroke-width="16" stroke-linecap="round"/>
      <polygon points="58,18 32,36 32,0" fill="#009E3D" stroke="#18181B" stroke-width="5" stroke-linejoin="round"/>
    </g>
  
      <g transform="translate(56, 76)">
        
    <g filter="url(#cornerShadow)" transform="scale(0.85)">
      <!-- Top looping arrow -->
      <path d="M-22 -8 L12 -8 A12 12 0 0 1 24 4 L24 8" fill="none" stroke="#18181B" stroke-width="9" stroke-linecap="round"/>
      <path d="M-22 -8 L12 -8 A12 12 0 0 1 24 4 L24 8" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <polygon points="-30,-8 -18,-18 -18,2" fill="#FFFFFF" stroke="#18181B" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- Bottom looping arrow -->
      <path d="M22 8 L-12 8 A12 12 0 0 1 -24 -4 L-24 -8" fill="none" stroke="#18181B" stroke-width="9" stroke-linecap="round"/>
      <path d="M22 8 L-12 8 A12 12 0 0 1 -24 -4 L-24 -8" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <polygon points="30,8 18,18 18,-2" fill="#FFFFFF" stroke="#18181B" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  
      </g>
      <g transform="rotate(180 215 322.5) translate(56, 76)">
        
    <g filter="url(#cornerShadow)" transform="scale(0.85)">
      <!-- Top looping arrow -->
      <path d="M-22 -8 L12 -8 A12 12 0 0 1 24 4 L24 8" fill="none" stroke="#18181B" stroke-width="9" stroke-linecap="round"/>
      <path d="M-22 -8 L12 -8 A12 12 0 0 1 24 4 L24 8" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <polygon points="-30,-8 -18,-18 -18,2" fill="#FFFFFF" stroke="#18181B" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- Bottom looping arrow -->
      <path d="M22 8 L-12 8 A12 12 0 0 1 -24 -4 L-24 -8" fill="none" stroke="#18181B" stroke-width="9" stroke-linecap="round"/>
      <path d="M22 8 L-12 8 A12 12 0 0 1 -24 -4 L-24 -8" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <polygon points="30,8 18,18 18,-2" fill="#FFFFFF" stroke="#18181B" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  
      </g>
    </svg>