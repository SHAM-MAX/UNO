<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 645" width="430" height="645">
      
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="3" dy="5" stdDeviation="2" flood-color="#000000" flood-opacity="0.32" />
      </filter>
      <filter id="cornerShadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="2" dy="3" stdDeviation="1" flood-color="#000000" flood-opacity="0.55" />
      </filter>
      <linearGradient id="wildGloss" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
      </linearGradient>
    </defs>
  
      
    <!-- Crisp Outer White Border -->
    <rect x="0" y="0" width="430" height="645" rx="36" fill="#FFFFFF" />
    <!-- Inner Card Colored Face -->
    <rect x="18" y="18" width="394" height="609" rx="26" fill="#1B1C20" />
  
      
    <!-- Tilted Center Oval -->
    <ellipse cx="215" cy="322.5" rx="145" ry="245" transform="rotate(-26 215 322.5)" fill="#1B1C20" />
  
      
    <!-- Center Wild 4-Color Oval -->
    <g transform="rotate(-26 215 322.5)" filter="url(#shadow)">
      <!-- 4 Quadrants -->
      <!-- Red Top-Left -->
      <path d="M215 110 A115 190 0 0 0 100 322.5 L215 322.5 Z" fill="#E52521" />
      <!-- Blue Top-Right -->
      <path d="M215 110 A115 190 0 0 1 330 322.5 L215 322.5 Z" fill="#0055A5" />
      <!-- Yellow Bottom-Left -->
      <path d="M215 535 A115 190 0 0 1 100 322.5 L215 322.5 Z" fill="#FFD500" />
      <!-- Green Bottom-Right -->
      <path d="M215 535 A115 190 0 0 0 330 322.5 L215 322.5 Z" fill="#009E3D" />

      <!-- Center Cross Divider -->
      <line x1="100" y1="322.5" x2="330" y2="322.5" stroke="#18181B" stroke-width="8" />
      <line x1="215" y1="110" x2="215" y2="535" stroke="#18181B" stroke-width="8" />

      <!-- Outer Oval Rim -->
      <ellipse cx="215" cy="322.5" rx="115" ry="190" fill="none" stroke="#FFFFFF" stroke-width="8" />
      <ellipse cx="215" cy="322.5" rx="115" ry="190" fill="url(#wildGloss)" />
    </g>
  
      <g transform="translate(56, 76)">
        
    <g filter="url(#cornerShadow)" transform="scale(0.9)">
      <ellipse cx="0" cy="0" rx="20" ry="28" fill="#1B1C20" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M0 -28 A20 28 0 0 0 -20 0 L0 0 Z" fill="#E52521"/>
      <path d="M0 -28 A20 28 0 0 1 20 0 L0 0 Z" fill="#0055A5"/>
      <path d="M0 28 A20 28 0 0 1 -20 0 L0 0 Z" fill="#FFD500"/>
      <path d="M0 28 A20 28 0 0 0 20 0 L0 0 Z" fill="#009E3D"/>
    </g>
  
      </g>
      <g transform="rotate(180 215 322.5) translate(56, 76)">
        
    <g filter="url(#cornerShadow)" transform="scale(0.9)">
      <ellipse cx="0" cy="0" rx="20" ry="28" fill="#1B1C20" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M0 -28 A20 28 0 0 0 -20 0 L0 0 Z" fill="#E52521"/>
      <path d="M0 -28 A20 28 0 0 1 20 0 L0 0 Z" fill="#0055A5"/>
      <path d="M0 28 A20 28 0 0 1 -20 0 L0 0 Z" fill="#FFD500"/>
      <path d="M0 28 A20 28 0 0 0 20 0 L0 0 Z" fill="#009E3D"/>
    </g>
  
      </g>
    </svg>