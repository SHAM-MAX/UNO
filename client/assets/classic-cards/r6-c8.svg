<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 645" width="430" height="645">
      
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="3" dy="5" stdDeviation="2" flood-color="#000000" flood-opacity="0.32" />
      </filter>
      <filter id="cornerShadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="2" dy="3" stdDeviation="1" flood-color="#000000" flood-opacity="0.55" />
      </filter>
      <linearGradient id="wildGloss" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
      </linearGradient>
    </defs>
  
      
    <!-- Crisp Outer White Border -->
    <rect x="0" y="0" width="430" height="645" rx="36" fill="#FFFFFF" />
    <!-- Inner Card Colored Face -->
    <rect x="18" y="18" width="394" height="609" rx="26" fill="#009E3D" />
  
      
    <!-- Tilted Center Oval -->
    <ellipse cx="215" cy="322.5" rx="145" ry="245" transform="rotate(-26 215 322.5)" fill="#FFFFFF" />
  
      
    <!-- Center Number 9 -->
    <text x="215" y="340"
          font-family="'Arial Black', 'Impact', 'Trebuchet MS', 'Arial', sans-serif"
          font-size="225"
          font-weight="900"
          font-style="italic"
          text-anchor="middle"
          dominant-baseline="central"
          fill="#009E3D"
          stroke="#18181B"
          stroke-width="7"
          paint-order="stroke fill"
          filter="url(#shadow)">9</text>
    <line x1="140" y1="412" x2="290" y2="412" stroke="#18181B" stroke-width="26" stroke-linecap="round"/>
       <line x1="140" y1="412" x2="290" y2="412" stroke="#009E3D" stroke-width="18" stroke-linecap="round"/>
  
      <!-- Top-Left Corner -->
      <g transform="translate(56, 76)">
        
    <g filter="url(#cornerShadow)">
      <text x="0" y="4"
            font-family="'Arial Black', 'Impact', 'Trebuchet MS', 'Arial', sans-serif"
            font-size="68"
            font-weight="900"
            font-style="italic"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#FFFFFF"
            stroke="#18181B"
            stroke-width="5"
            paint-order="stroke fill">9</text>
      <line x1="-24" y1="24" x2="24" y2="24" stroke="#18181B" stroke-width="12" stroke-linecap="round" />
       <line x1="-24" y1="24" x2="24" y2="24" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    </g>
  
      </g>
      <!-- Bottom-Right Corner (Rotated 180) -->
      <g transform="rotate(180 215 322.5) translate(56, 76)">
        
    <g filter="url(#cornerShadow)">
      <text x="0" y="4"
            font-family="'Arial Black', 'Impact', 'Trebuchet MS', 'Arial', sans-serif"
            font-size="68"
            font-weight="900"
            font-style="italic"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#FFFFFF"
            stroke="#18181B"
            stroke-width="5"
            paint-order="stroke fill">9</text>
      <line x1="-24" y1="24" x2="24" y2="24" stroke="#18181B" stroke-width="12" stroke-linecap="round" />
       <line x1="-24" y1="24" x2="24" y2="24" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    </g>
  
      </g>
    </svg>